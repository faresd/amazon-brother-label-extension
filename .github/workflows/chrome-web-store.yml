name: Chrome Web Store release

on:
  workflow_call:
    inputs:
      tag:
        description: Existing release tag, for example v2.0.15
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v2.0.15
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: vars.CWS_UPLOAD_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
      - id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          tag="$REQUESTED_TAG"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mkdir release
          gh release download "$tag" --pattern '*-store.zip' --dir release
          test "$(find release -name '*-store.zip' -type f | wc -l)" -eq 1
          echo "package=$(find release -name '*-store.zip' -type f)" >> "$GITHUB_OUTPUT"
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_CWS_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
      - name: Upload and optionally submit for review
        env:
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          CWS_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          CWS_PACKAGE: ${{ steps.release.outputs.package }}
          CWS_SUBMIT_FOR_REVIEW: ${{ vars.CWS_SUBMIT_FOR_REVIEW }}
        run: node scripts/publish-store.mjs

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Package label</title>
  <link rel="stylesheet" href="print.css">
</head>
<body>
  <div class="toolbar">
    <strong>Brother QL-700 package label</strong>
    <span>Select 62 mm continuous media and use 100% scale. Length is calculated from the content.</span>
    <button id="print-again" type="button">Print</button>
    <button id="close-tab" type="button">Close</button>
  </div>
  <div id="print-viewport">
    <main id="label" aria-label="Package label">
      <div class="frame"></div>
      <div class="vertical sender-title">Sender:</div>
      <img class="logo" src="logo.bmp" alt="Cheap.ly">
      <div class="date" id="date"></div>
      <div class="vertical qr-help">Flash QR<br>to view sender details</div>
      <div id="qr" class="qr" aria-label="Sender details QR code"></div>
      <div id="channel" class="channel"></div>
      <div class="vertical destination-title">Destination:</div>
      <div id="destination" class="destination"></div>
    </main>
  </div>
  <p id="error" class="error" hidden></p>
  <script src="qrcode.js"></script>
  <script src="qrcode_UTF8.js"></script>
  <script src="print.js"></script>
</body>
</html>
